<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vanta Supply - Login</title>
        <link rel="stylesheet" href="style.css">
        <!--font import -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">    
    </head>
    <body>
        <header class="top-nav">
            <a href="index.html" class="brand-logo">VANTA SUPPLY</a>
        </header>
        <main class="login-section">
            <div class="login-container">
                <h1>Welcome back</h1>
                <p>Log in to your <span>Vanta Supply</span> account</p>

                <form class="login-form">
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" id="togglePassword">Show</button>
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember" name="remember">
                            Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                    <button type="submit" class="login-btn">Log In</button>
                    <p class="signup-text">Don't have an account? <a href="#" class="signup-link">Create one</a></p>
                </form>

                <a href="index.html" class="back-home-link">← Back to homepage</a>
            </div>
        </main>
    </body>
</html>
