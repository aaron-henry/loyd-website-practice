<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanta Supply4</title>
  <link rel="stylesheet" href="style.css">
  <!--font import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!--Navigation -->
  <header class="top-nav">
    <span class="brand-logo">PRODUCT</span>
  </header>

  <!-- Hero Section -->
  <main class="hero-section">
    <div class="hero-container">
      
      <!-- Left Column -->
      <div class="column left-col">
        <h2>Materials</h2>
      </div>

      <!-- Center Column (main visual)-->
      <div class="column center-col">
        <img src="popsicle.png" alt="3D Glass Popsicle Asset" class="feature-image">
      </div>

      <!-- Right Column -->
      <div class="column right-col">
        <h1>
          Visual ingredients<br> 
          for designers,<br> 
          motion artists, and<br> 
          <span class="gradient-text">creative</span> explorers.
        </h1>
      </div>

    </div>
  </main>

</body>
</html>
