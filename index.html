<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morrow Goods | Home</title>
  <link rel="stylesheet" href="style.css">
  <!--font import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- favicon -->
  <link rel="icon" type="image/png" href="images/icon.png">
</head>
<body>

  <!--Navigation -->
  <header class="top-nav">
    <a href="index.html" class="brand-logo">
      <img src="images/icon.png" alt="Morrow Goods" class="logo-img">
    </a>
    <nav class="top-nav-links">
      <a href="#shop" class="nav-link">Shop</a>
      <a href="#our-story" class="nav-link">Our Story</a>
      <a href="login.html" class="nav-link">Login</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <main class="hero-section">
    <div class="hero-split">

      <!--Left Side-->
      <div class="hero-content">
        <span class="hero-label">New Season Collection</span>
        <h1>Simple pieces for everyday living.</h1>
        <p class="hero-description">Explore thoughtfully selected clothing and accessories designed for comfort, quality and effortless style.</p>
        <div class="hero-buttons">
          <a href="#shop" class="btn btn-primary">Shop Collection</a>
          <a href="#our-story" class="btn btn-secondary">Our Story</a>
        </div>
      </div>

      <!--Right Side-->
      <div class="hero-image">
        <img src="images/popsicle.png" 
        alt="Person wearing a relaxed neutral-toned outfit from the Morrow Goods collection" class="hero-img">
      </div>
    </div>
  </main>

</body>
</html>
